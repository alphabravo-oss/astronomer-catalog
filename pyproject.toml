[project]
name = "astronomer-catalog-tools"
version = "0.1.0"
description = "Build and validate Astronomer catalog v1 metadata"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
build = ["jsonschema[format]==4.26.0", "PyYAML==6.0.3", "referencing==0.37.0"]
test = [{ include-group = "build" }]
lint = ["ruff==0.17.0"]
type = [{ include-group = "build" }, "mypy==2.4.0", "types-PyYAML==6.0.12.20260906", "types-jsonschema==4.26.0.20261006"]
audit = ["pip-audit==2.10.1", "cyclonedx-bom==7.5.0"]
build-backend = ["setuptools==84.0.0", "Cython==3.3.0"]

[tool.uv]
package = false
default-groups = ["build", "test", "lint", "type", "audit"]
required-version = "==0.13.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.15"
files = ["scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Exact primary PyPI/source PKG-INFO metadata avoids resolver backend execution.
[[tool.uv.dependency-metadata]]
name = "PyYAML"
version = "6.0.3"
requires-python = ">=3.8"
requires-dist = []
