name: Upstream version review

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: false
      - name: Synchronize reviewed locked tools
        run: python scripts/sync_tools.py --python "$(command -v python)"
      - name: Discover upstream candidates without changing pins
        run: .venv/bin/python scripts/upstream_report.py --output qualification/upstream-report.json
      - name: Retain candidate and unknown results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-version-review
          path: qualification/upstream-report.json
          if-no-files-found: error
